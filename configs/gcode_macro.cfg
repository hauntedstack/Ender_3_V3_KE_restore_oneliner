# Ender-3V3 KE Complete Macro Configuration with Fast Bed Mesh

[exclude_object]

[virtual_sdcard]
path: /usr/data/printer_data/gcodes

[pause_resume]

[display_status]

[gcode_macro CANCEL_PRINT]
description: Cancel the actual running print with fast cooling
rename_existing: CANCEL_PRINT_BASE
gcode:
    TURN_OFF_HEATERS
    {% if "xyz" in printer.toolhead.homed_axes %}
        G91
        G1 Z15 F3000   ; Lift nozzle higher (15mm instead of 2mm) for better air circulation
        G90
    {% else %}
        {action_respond_info("Printer not homed")}
        G28 X Y
    {% endif %}
    G1 F3000 X0 Y222   ; Move to park position
    M104 S0           ; Turn off hotend (set to 0°C)
    M106 S255         ; Set cooling fan to max for rapid cooldown
    G4 P5000          ; Wait 5 seconds at full fan
    M107              ; Turn off fan after cooling
    M84               ; Disable motors
    CANCEL_PRINT_BASE
    FINISH_INIT

[gcode_macro START_PRINT]
gcode:
    {% set BED_TEMP = params.BED_TEMP|default(60)|float %}
    {% set EXTRUDER_TEMP = params.EXTRUDER_TEMP|default(210)|float %}

    # Step 1: Heat bed to final temperature and wait
    M190 S{BED_TEMP}

    # Step 2: Home the printer
    G28

    # Step 3: Run KAMP adaptive bed mesh (probes only the print area)
    BED_MESH_CALIBRATE

    # Step 4: Smart park near print area for final heatup
    SMART_PARK

    # Step 5: Heat nozzle to its FINAL printing temperature and wait
    M109 S{EXTRUDER_TEMP}

    # Step 6: Adaptive purge line next to the print
    LINE_PURGE

[gcode_macro PRINT_CALIBRATION]
# This part of the command is replaced by the application side without passing parameters
gcode:
  CX_PRINT_LEVELING_CALIBRATION

[gcode_macro BED_MESH_CALIBRATE_FAST]
description: Fast bed mesh calibration that scales probe count to specified area
gcode:
  # Get global variables
  {% set km = printer["gcode_macro PRINTER_PARAM"] %}
  {% set probe_mesh_padding = km.probe_mesh_padding %}
  {% set probe_min_count = km.probe_min_count %}
  {% set probe_count_scale = km.probe_count_scale %}
  {% set bed_mesh = printer.configfile.settings.bed_mesh %}

  # Get bed mesh limits from config
  {% set safe_min_x = bed_mesh.mesh_min[0] %}
  {% set safe_min_y = bed_mesh.mesh_min[1] %}
  {% set safe_max_x = bed_mesh.mesh_max[0] %}
  {% set safe_max_y = bed_mesh.mesh_max[1] %}

  # Handle MESH_MIN parameter
  {% if "MESH_MIN" in params %}
    {% set mesh_min_x = (params.MESH_MIN.split(",")[0]|float - probe_mesh_padding, safe_min_x)|max %}
    {% set mesh_min_y = (params.MESH_MIN.split(",")[1]|float - probe_mesh_padding, safe_min_y)|max %}
  {% else %}
    {% set mesh_min_x = safe_min_x %}
    {% set mesh_min_y = safe_min_y %}
  {% endif %}

  # Handle MESH_MAX parameter
  {% if "MESH_MAX" in params %}
    {% set mesh_max_x = (params.MESH_MAX.split(",")[0]|float + probe_mesh_padding, safe_max_x)|min %}
    {% set mesh_max_y = (params.MESH_MAX.split(",")[1]|float + probe_mesh_padding, safe_max_y)|min %}
  {% else %}
    {% set mesh_max_x = safe_max_x %}
    {% set mesh_max_y = safe_max_y %}
  {% endif %}

  # Calculate probe count
  {% set probe_count = bed_mesh.probe_count if not params.PROBE_COUNT else params.PROBE_COUNT.split(",")|map('int')|list %}

  # Scale probe count if not explicitly provided
  {% if "PROBE_COUNT" not in params %}
    {% set max_x_probes = probe_count[0] %}
    {% set max_y_probes = probe_count[-1] %}

    {% set x_probes = (max_x_probes * (mesh_max_x - mesh_min_x) / (safe_max_x - safe_min_x) * probe_count_scale) | round(0) | int %}
    {% set x_probes = ((x_probes, probe_min_count)|max, max_x_probes)|min %}

    {% set y_probes = (max_y_probes * (mesh_max_y - mesh_min_y) / (safe_max_y - safe_min_y) * probe_count_scale) | round(0) | int %}
    {% set y_probes = ((y_probes, probe_min_count)|max, max_y_probes)|min %}

    # Add probes for bicubic if one axis has too many probes for lagrange
    {% if x_probes > 6 and y_probes < 4 %}
      {% set y_probes = 4 %}
    {% elif y_probes > 6 and x_probes < 4 %}
      {% set x_probes = 4 %}
    {% endif %}
    {% set probe_count = [x_probes, y_probes] %}
  {% elif probe_count|length == 1 %}
    {% set dummy = probe_count.append(probe_count[0]) %}
  {% endif %}

  # Force bicubic if we've exceeded the max for lagrange
  {% set algorithm = "lagrange" %}
  {% if probe_count[0] > 6 or probe_count[1] > 6 %}
    {% set algorithm = "bicubic" %}
  {% endif %}

  # Execute the bed mesh calibration
  {action_respond_info("Fast bed mesh: %dx%d points, area: (%.1f,%.1f) to (%.1f,%.1f)" %
                        (probe_count[0], probe_count[1], mesh_min_x, mesh_min_y, mesh_max_x, mesh_max_y))}

  BED_MESH_CALIBRATE MESH_MIN={mesh_min_x},{mesh_min_y} MESH_MAX={mesh_max_x},{mesh_max_y} PROBE_COUNT={probe_count|join(',')} ALGORITHM={algorithm}

[gcode_macro BED_MESH_CHECK]
description: Warns if bed_mesh config may generate an invalid mesh
gcode:
  {% if printer.bed_mesh is defined %}
    {% set action = action_respond_info if params.ABORT|default(0)|int == 0 else action_raise_error %}
    {% set settings = printer.configfile.settings %}
    {% set x_min = settings.stepper_x.position_min %}
    {% set y_min = settings.stepper_y.position_min %}
    {% set x_max = settings.stepper_x.position_max %}
    {% set y_max = settings.stepper_y.position_max %}

    {% set label = "[bed_mesh] config" %}
    {% if "MESH_MIN" in params %}
      {% set label = "BED_MESH_CALIBRATE params" %}
      {% set mesh_min_x = params.MESH_MIN.split(",")[0]|float %}
      {% set mesh_min_y = params.MESH_MIN.split(",")[1]|float %}
    {% else %}
      {% set mesh_min_x = settings.bed_mesh.mesh_min[0] %}
      {% set mesh_min_y = settings.bed_mesh.mesh_min[1] %}
    {% endif %}
    {% if "MESH_MAX" in params %}
      {% set label = "BED_MESH_CALIBRATE params" %}
      {% set mesh_max_x = params.MESH_MAX.split(",")[0]|float %}
      {% set mesh_max_y = params.MESH_MAX.split(",")[1]|float %}
    {% else %}
      {% set mesh_max_x = settings.bed_mesh.mesh_max[0] %}
      {% set mesh_max_y = settings.bed_mesh.mesh_max[1] %}
    {% endif %}

    {% if "bltouch" in settings %}
        {% set x_offset = settings.bltouch.x_offset %}
        {% set y_offset = settings.bltouch.y_offset %}
        {% set probe = "bltouch" %}
    {% elif "probe" in settings %}
        {% set x_offset = settings.probe.x_offset %}
        {% set y_offset = settings.probe.y_offset %}
        {% set probe = "probe" %}
    {% else %}
        {% set x_offset = 0.0 %}
        {% set y_offset = 0.0 %}
    {% endif %}

    {% set output = [] %}
    {% set warn = "* mesh_%s (%f, %f) adjusted by " ~ probe ~ ".%s_offset (%f) can move out of range for stepper_%s.position_%s (%f)." %}
    {% if x_offset > 0 and (mesh_min_x - x_offset) < x_min %}
      {% set dummy = output.append(warn % ('min', mesh_min_x, mesh_min_y, 'x', x_offset, 'x', 'min', x_min)) %}
    {% elif x_offset < 0 and (mesh_max_x - x_offset) > x_max %}
      {% set dummy = output.append(warn % ('max', mesh_max_x, mesh_max_y, 'x', x_offset, 'x', 'max', x_max)) %}
    {% endif %}
    {% if y_offset > 0 and (mesh_min_y - y_offset) < y_min %}
      {% set dummy = output.append(warn % ('min', mesh_min_x, mesh_min_y, 'y', y_offset, 'y', 'min', y_min)) %}
    {% elif y_offset < 0 and (mesh_max_y - y_offset) > y_max %}
      {% set dummy = output.append(warn % ('max', mesh_max_x, mesh_max_y, 'y', y_offset, 'y', 'max', y_max)) %}
    {% endif %}

    {% if output %}
      { action("Warning: The following issue(s) were detected in your " ~ label ~ ":\n" ~ output|join("\n")) }
    {% endif %}
  {% endif %}

[gcode_macro MESH_AREA]
description: Perform bed mesh on a specific area
gcode:
  {% if "MESH_MIN" not in params or "MESH_MAX" not in params %}
    {action_raise_error("MESH_AREA requires MESH_MIN and MESH_MAX parameters")}
  {% endif %}

  G28
  BED_MESH_CALIBRATE_FAST MESH_MIN={params.MESH_MIN} MESH_MAX={params.MESH_MAX}
  {action_respond_info("Bed mesh completed for area: %s to %s" % (params.MESH_MIN, params.MESH_MAX))}

[gcode_macro FIRST_FLOOR_PAUSE_POSITION]
gcode:
  {% set extruder_temp = printer.custom_macro.g28_ext_temp %}
  M104 S{extruder_temp}
  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer['gcode_macro PRINTER_PARAM'].max_x_position|float %}
  G90
  G1 Z2 F600
  G1 X{x_park} Y{y_park} F6000
  G1 Z0.2 F600

[gcode_macro FIRST_FLOOR_RESUME]
description: Resume the first floor print
gcode:
    ##### read E from pause macro #####
  {% set E = printer["gcode_macro FIRST_FLOOR_PAUSE"].extrude|float + 1.0 %}
  #### get VELOCITY parameter if specified ####
  {% if 'VELOCITY' in params|upper %}
    {% set get_params = ('VELOCITY=' + params.VELOCITY) %}
  {%else %}
    {% set get_params = "" %}
  {% endif %}
  ##### end of definitions #####
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E{E} F2100
  {% else %}
    {action_respond_info("Extruder not hot enough")}
  {% endif %}
  RESUME_BASE {get_params}

[gcode_macro FIRST_FLOOR_PAUSE]
description: Pause the first floor print
# change this if you need more or less extrusion
variable_extrude: 2.0
gcode:
  ##### read E from pause macro #####
  {% set E = printer["gcode_macro FIRST_FLOOR_PAUSE"].extrude|float %}
  ##### set park positon for x and y #####
  # default is your max posion from your printer.cfg
  {% set y_park = printer.toolhead.axis_maximum.y/2 %}
  {% set x_park = printer.toolhead.axis_maximum.x|float - 10.0 %}
  ##### calculate save lift position #####
  {% set max_z = printer["gcode_macro PRINTER_PARAM"].max_z_position|float %}
  {% set act_z = printer.toolhead.position.z|float %}
  {% set z_safe = 0.0 %}
  {% if act_z < (max_z - 2.0) %}
    {% set z_safe = 2.0 %}
  {% elif act_z < max_z %}
    {% set z_safe = max_z - act_z %}
  {% endif %}
  ##### end of definitions #####
  SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=z_safe_pause VALUE={z_safe|float}
  PAUSE_BASE
  G91
  {% if "xyz" in printer.toolhead.homed_axes %}
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-1.0 F180
      G1 E-{E} F4000
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    G1 Z{z_safe} F600
    G90
    G1 X{x_park} Y{y_park} F30000
  {% else %}
    {action_respond_info("Printer not homed")}
  {% endif %}

[gcode_macro PAUSE]
description: Pause the actual running print
rename_existing: PAUSE_BASE
# change this if you need more or less extrusion
variable_extrude: 1.0
gcode:
    ##### read E from pause macro #####
    {% set E = printer["gcode_macro PAUSE"].extrude|float %}
    ##### set park positon for x and y #####
    # default is your max posion from your printer.cfg
    # {% set x_park = printer.toolhead.axis_maximum.x|float - 5.0 %}
    # {% set y_park = printer.toolhead.axis_maximum.y|float - 5.0 %}

    {% set x_park = 0 %}
    {% set y_park = 222 %}
    ##### calculate save lift position #####
    {% set max_z = printer.toolhead.axis_maximum.z|float %}
    {% set act_z = printer.toolhead.position.z|float %}
    {% if act_z < 48.0 %}
        {% set z_safe = 50.0 - act_z %}
    {% elif act_z < (max_z - 2.0) %}
        {% set z_safe = 2.0 %}
    {% else %}
        {% set z_safe = max_z - act_z %}
    {% endif %}
    SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=z_safe_pause VALUE={z_safe|float}
    ##### end of definitions #####
    PAUSE_BASE
    G91
    SET_GCODE_VARIABLE MACRO=PRINTER_PARAM VARIABLE=hotend_temp VALUE={printer.extruder.target}
    M104 S140
    {% if printer.extruder.can_extrude|lower == 'true' %}
      G1 E-{E} F2100
    {% else %}
      {action_respond_info("Extruder not hot enough")}
    {% endif %}
    {% if "xyz" in printer.toolhead.homed_axes %}
      G1 Z{z_safe} F600
      M400
      G90
      G1 X{x_park} Y{y_park} F6000
    {% else %}
      {action_respond_info("Printer not homed")}
    {% endif %}

[gcode_macro PRINTER_PARAM]
variable_z_safe_pause: 0.0
variable_max_x_position: 220.0
variable_max_y_position: 220.0
variable_max_z_position: 240.0
variable_fans: 3
variable_auto_g29: 0
variable_default_bed_temp: 50
variable_default_extruder_temp: 240
variable_g28_extruder_temp: 140
variable_print_calibration: 0
variable_fan0_min: 140
variable_hotend_temp: 200
# Fast bed mesh variables
variable_probe_mesh_padding: 5.0
variable_probe_min_count: 3
variable_probe_count_scale: 1.0
gcode:

[gcode_macro STRUCTURE_PARAM]
variable_bed_length: 220
variable_bed_width: 220
variable_bed_hight: 240
variable_laser_x_offset: 45.0
variable_laser_y_offset: -8.0
variable_laser_z_offset: 3.0
variable_cali_x_offset: 204.0
variable_cali_y_offset: 14.0
variable_cali_z_offset: 3.0
gcode:

[gcode_macro M900]
gcode:
  {% if 'K' in params %}
    {% if 'E' in params %}
      SET_PRESSURE_ADVANCE EXTRUDER={params.E} ADVANCE={params.K}
    {% else %}
      SET_PRESSURE_ADVANCE ADVANCE={params.K}
    {% endif %}
  {% endif %}

[gcode_arcs]
resolution: 1.0

[gcode_macro M204]
rename_existing: M204.1
gcode:
  {% set get_params = "" %}
  {% if 'S' in params|upper %}
    {% set get_params = (get_params + ' ' + 'S' + params.S) %}
  {% endif %}
  {% if 'P' in params|upper %}
    {% set get_params = (get_params + ' ' + 'P' + params.P) %}
  {% endif %}
  {% if 'T' in params|upper %}
    {% set get_params = (get_params + ' ' + 'T' + params.T) %}
  {% endif %}
  M204.1 {get_params}

[gcode_macro M205]
gcode:
  {% if 'X' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.X}
  {% elif 'Y' in params %}
    SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY={params.Y}
  {% endif %}

[gcode_macro G29]
gcode:
  M204 S5000
  G90
  M104 S0
  M107
  G28
  BED_MESH_CALIBRATE_FAST
  G1 X110 Y110 Z10
  M140 S0
  CXSAVE_CONFIG

[gcode_macro INPUTSHAPER_X]
gcode:
  M84
  G90
  G28
  SHAPER_CALIBRATE AXIS=x
  CXSAVE_CONFIG

[gcode_macro INPUTSHAPER_Y]
gcode:
  M84
  G90
  G28
  SHAPER_CALIBRATE AXIS=y
  CXSAVE_CONFIG

[gcode_macro INPUTSHAPER]
gcode:
  G90
  {% if "xyz" not in printer.toolhead.homed_axes %}
    G28
  {% endif %}
  {% if 'X' in params.AXES|upper %}
    SHAPER_CALIBRATE AXIS=X
  {% elif 'Y' in params.AXES|upper %}
    SHAPER_CALIBRATE AXIS=Y
  {% else %}
    SHAPER_CALIBRATE
  {% endif %}
  CXSAVE_CONFIG

[gcode_macro AUTOTUNE_SHAPERS]
gcode:

[gcode_macro Z_OFFSET_TEST]
gcode:
  G28
  Z_OFFSET_CALIBRATION
  CXSAVE_CONFIG

[gcode_macro ZZ_OFFSET_TEST]
gcode:
  G28
  Z_OFFSET_AUTO
  CXSAVE_CONFIG

[gcode_macro Z_COMPENSATE_TEST]
gcode:
  G28
  CRTENSE_NOZZLE_CLEAR
  Z_OFFSET_CALIBRATION

[gcode_macro M106]
gcode:
  {% set fan = 0 %}
  {% set value = 255 %}
  {% if params.S is defined %}
    {% set tmp = params.S|int %}
    {% if tmp <= 255 %}
      {% set value = tmp %}
    {% endif %}
  {% endif %}
  {% if params.P is defined %}
    {% if params.P|int == 0 %}
        {% set value = printer["gcode_macro PRINTER_PARAM"].fan0_min + (255 - printer["gcode_macro PRINTER_PARAM"].fan0_min) / 255 * tmp %}
        {% if tmp < 1 %}
          {% set value = tmp %}
        {% endif %}
        SET_PIN PIN=fan0 VALUE={value}
    {% endif %}
  {% else %}
    {% set value = printer["gcode_macro PRINTER_PARAM"].fan0_min + (255 - printer["gcode_macro PRINTER_PARAM"].fan0_min) / 255 * tmp %}
    {% if tmp < 1 %}
      {% set value = tmp %}
    {% endif %}
    SET_PIN PIN=fan0 VALUE={value}
  {% endif %}

[gcode_macro M107]
gcode:
  {% if params.P is defined %}
    SET_PIN PIN=fan0 VALUE=0
  {% else %}
    SET_PIN PIN=fan0 VALUE=0
  {% endif %}

[gcode_macro LOAD_MATERIAL]
gcode:
  SAVE_GCODE_STATE NAME=myMoveState
  M109 S{printer.custom_macro.default_extruder_temp}
  G91
  G1 E150 F180
  RESTORE_GCODE_STATE NAME=myMoveState

[gcode_macro QUIT_MATERIAL]
gcode:
  SAVE_GCODE_STATE NAME=myMoveState
  M109 S{printer.custom_macro.default_extruder_temp}
  G91
  G1 E20 F180
  G1 E-30 F180
  G1 E-50 F2000
  RESTORE_GCODE_STATE NAME=myMoveState

[gcode_macro M600]
gcode:
  PAUSE
  {% set act_e = printer.toolhead.position.e|float %}
  G91
  G1 E20 F180
  G1 E-30 F180
  G1 E-50 F2000
  G90
  G92 E{act_e}

[gcode_macro FINISH_INIT]
gcode:
  {% set extruder = printer.configfile.settings['extruder'] %}
  {% set printer = printer.configfile.settings['printer'] %}
  SET_PRESSURE_ADVANCE ADVANCE={extruder.pressure_advance}
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL={printer.max_accel_to_decel}
  # Square corner velocity: 5mm/s
  SET_VELOCITY_LIMIT SQUARE_CORNER_VELOCITY=5
  # Acceleration: 5000mm/s²
  M204 S5000
  # Deceleration: 5000mm/s²
  SET_VELOCITY_LIMIT ACCEL_TO_DECEL=5000
  # Speed factor: 100%
  M220 S100
  # Extrusion flow: 100%
  M221 S100

[gcode_macro EJECT_PRINT]
gcode:
    M140 S45                    ; Cool bed to 35°C
    M104 S0                     ; Turn off hotend immediately
    M190 S45                    ; Wait for bed temperature
    G4 P10000                   ; Wait 10 seconds
    G91                         ; Relative positioning
    G0 Z10 F3000                ; Lift Z relatively (safer)
    G90                         ; Back to absolute
    G28 X Y                     ; Home X and Y
    G0 X115 Y223 F10000         ; Move bed ALL THE WAY BACK first
    G0 Z2.0 F3000               ; Lower head to 2mm (safe, print is in front of the head)
    G0 Y-20 F6000               ; Push FORWARD - print is shoved forward toward you
    G0 Z50 F3000                ; Raise Z
    G28                         ; Home all
    M140 S0                     ; Bed off
    M84                         ; Disable steppers

[gcode_macro SAFE_EXTRUDE]
description: Progressive extrusion with Z-lift and flow ramp
gcode:
    {% set LENGTH = params.LENGTH|default(50)|float %}
    {% set TEMP = params.TEMP|default(220)|float %}
    {% set MIN_Z = 60 %}

    SAVE_GCODE_STATE NAME=safe_extrude_state

    # === SAFETY: home + Z-lift ===
    {% if "xyz" not in printer.toolhead.homed_axes %}
        RESPOND TYPE=command MSG="Homing first..."
        G28
    {% endif %}

    {% set current_z = printer.toolhead.position.z|float %}
    {% if current_z < MIN_Z %}
        G90
        G1 Z{MIN_Z} F1200
        M400
    {% endif %}

    # === HEATING ===
    RESPOND TYPE=command MSG="Heating to {TEMP}C..."
    M109 S{TEMP}
    RESPOND TYPE=command MSG="Hotend ready. Beginning progressive extrusion..."

    M83

    # === PROGRESSIVE RAMP UP ===
    # Phase 1: Slow start - prime the hotend (10% of length, very slow)
    {% set phase1 = (LENGTH * 0.10)|float %}
    {% if phase1 > 0 %}
        RESPOND TYPE=command MSG="Phase 1/5: Priming ({phase1}mm @ 60mm/min)"
        G1 E{phase1} F60
    {% endif %}

    # Phase 2: Ramp up - heat propagates (15%)
    {% set phase2 = (LENGTH * 0.15)|float %}
    {% if phase2 > 0 %}
        RESPOND TYPE=command MSG="Phase 2/5: Ramping ({phase2}mm @ 180mm/min)"
        G1 E{phase2} F180
    {% endif %}

    # Phase 3: Acceleration - flow stabilizes (20%)
    {% set phase3 = (LENGTH * 0.20)|float %}
    {% if phase3 > 0 %}
        RESPOND TYPE=command MSG="Phase 3/5: Accelerating ({phase3}mm @ 300mm/min)"
        G1 E{phase3} F300
    {% endif %}

    # Phase 4: Cruise - full speed (40%)
    {% set phase4 = (LENGTH * 0.40)|float %}
    {% if phase4 > 0 %}
        RESPOND TYPE=command MSG="Phase 4/5: Cruising ({phase4}mm @ 500mm/min)"
        G1 E{phase4} F500
    {% endif %}

    # Phase 5: Clean finish - slow finish for a clean tip (15%)
    {% set phase5 = (LENGTH * 0.15)|float %}
    {% if phase5 > 0 %}
        RESPOND TYPE=command MSG="Phase 5/5: Clean finish ({phase5}mm @ 120mm/min)"
        G1 E{phase5} F120
    {% endif %}

    M400
    RESPOND TYPE=command MSG="Extrusion complete: {LENGTH}mm total"

    RESTORE_GCODE_STATE NAME=safe_extrude_state
